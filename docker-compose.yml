version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fit_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fit_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgresql}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgresql}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fit_network

  app:
    build: ./src/backend
    container_name: fit_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/backend:/app
    networks:
      - fit_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload


  frontend:
    build: ./src/frontend/fitness-planner
    container_name: fit_frontend
    networks:
      - fit_network
    ports:
      - "3000:3000"
    expose:
      - "3000"


volumes:
  postgres_data:

networks:
  fit_network:
    driver: bridge
